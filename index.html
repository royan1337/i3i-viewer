<script>
const $=id=>document.getElementById(id);
const state={files:[],current:-1,decoded:null,original:null};

function u32(a,p){return (a[p]|(a[p+1]<<8)|(a[p+2]<<16)|(a[p+3]<<24))>>>0}
function str(a,p,n){let s='';for(let i=0;i<n&&p+i<a.length;i++)s+=String.fromCharCode(a[p+i]);return s}
function clamp(v){return v<0?0:v>255?255:v}

function findI3IB(a){
  // I3I Point Blank menggunakan signature I3IB pada awal file.
  // Tetap scan seluruh buffer agar file yang mempunyai prefix tambahan
  // juga dapat dibuka.
  for(let i=0;i<=a.length-4;i++){
    if(a[i]===0x49&&a[i+1]===0x33&&a[i+2]===0x49&&a[i+3]===0x42)return i;
  }
  return -1;
}

function calcMipSize(w,h,fmt){
  const bw=Math.max(1,Math.ceil(w/4));
  const bh=Math.max(1,Math.ceil(h/4));
  return bw*bh*(fmt==='DXT1'?8:16);
}

function calcTextureSize(w,h,fmt,mips){
  let total=0,ww=w,hh=h;
  const count=Math.max(1,Math.min(32,mips|0));
  for(let i=0;i<count;i++){
    total+=calcMipSize(ww,hh,fmt);
    if(ww===1&&hh===1)break;
    ww=Math.max(1,ww>>1);
    hh=Math.max(1,hh>>1);
  }
  return total;
}

function formatFromCode(code){
  // Format code I3I: 1=Dxt1, 3=Dxt3, 5=Dxt5.
  if(code===1)return 'DXT1';
  if(code===3)return 'DXT3';
  if(code===5)return 'DXT5';
  return null;
}

function parseI3IHeader(a,off){
  const headerEnd=off+60;
  if(headerEnd>a.length)throw new Error('Header I3I tidak lengkap (kurang dari 60 byte)');

  // Struktur header yang dipakai oleh I3IB:
  // +04 format, +06 width, +08 height, +18 jumlah mipmap.
  const formatCode=a[off+4];
  const fmt=formatFromCode(formatCode);
  const w=a[off+6]|(a[off+7]<<8);
  const h=a[off+8]|(a[off+9]<<8);
  const mips=u32(a,off+0x18);

  if(!fmt)throw new Error(`Format I3I tidak didukung (code ${formatCode})`);
  if(!w||!h||w>8192||h>8192)throw new Error(`Ukuran I3I tidak valid: ${w}×${h}`);
  if(!mips||mips>32)throw new Error(`Jumlah mipmap tidak valid: ${mips}`);

  let expected=calcTextureSize(w,h,fmt,mips);
  const available=a.length-headerEnd;

  // Beberapa I3I Point Blank mempunyai nilai format di header yang tidak
  // cocok dengan ukuran payload aktual. Contoh: header menyebut DXT5,
  // tetapi payload 256x256 + 4 mip berukuran tepat 43520 byte, yaitu DXT1.
  // Jangan langsung gagal; cocokkan kembali ukuran payload dengan semua
  // format DXT untuk dimensi/mipmap yang sudah terbaca dari header.
  if(available<expected){
    const alternatives=['DXT1','DXT3','DXT5'];
    const exact=alternatives.find(f=>calcTextureSize(w,h,f,mips)===available);
    if(exact){
      return {fmt:exact,w,h,mips,headerEnd,expected:available,available,formatCode,headerFormat:fmt,formatMismatch:true};
    }

    // Bila file berisi beberapa texture/extra data, cari satu blok texture
    // yang ukurannya tepat dan tetap gunakan metadata header untuk dimensi.
    const matches=alternatives
      .map(f=>({fmt:f,total:calcTextureSize(w,h,f,mips)}))
      .filter(x=>x.total<=available);
    if(matches.length){
      // Prioritaskan format header bila bloknya masih muat.
      const same=matches.find(x=>x.fmt===fmt);
      const pick=same||matches.sort((a,b)=>b.total-a.total)[0];
      return {fmt:pick.fmt,w,h,mips,headerEnd,expected:pick.total,available,formatCode,headerFormat:fmt,formatMismatch:pick.fmt!==fmt};
    }

    throw new Error(`Data texture kurang: perlu ${expected} byte (${fmt}), tersedia ${available} byte`);
  }

  return {fmt,w,h,mips,headerEnd,expected,available,formatCode,headerFormat:fmt,formatMismatch:false};
}

function detectFormatAndSize(payload,mips,header){
  // Prioritaskan metadata header. Ini penting untuk I3I seperti Common_12.i3i:
  // file dapat mempunyai data tambahan setelah texture utama, sehingga
  // ukuran seluruh file tidak boleh dipakai untuk menebak dimensi.
  if(header){
    return {
      fmt:header.fmt,
      w:header.w,
      h:header.h,
      total:header.expected
    };
  }

  // Fallback untuk varian I3I yang tidak mempunyai metadata format yang dikenal.
  const candidates=['DXT1','DXT3','DXT5'];
  for(const fmt of candidates){
    for(let p=0;p<=13;p++){
      const w=1<<p,h=w;
      const total=calcTextureSize(w,h,fmt,mips||1);
      if(total===payload)return {fmt,w,h,total};
    }
  }
  return null;
}

function rgb565(c){
  return [(c>>11&31)*255/31,(c>>5&63)*255/63,(c&31)*255/31];
}
function decodeDXT1(data,w,h){
  const out=new Uint8ClampedArray(w*h*4),bw=Math.ceil(w/4),bh=Math.ceil(h/4);
  for(let by=0;by<bh;by++)for(let bx=0;bx<bw;bx++){
    const o=(by*bw+bx)*8;if(o+8>data.length)continue;
    const c0=data[o]|data[o+1]<<8,c1=data[o+2]|data[o+3]<<8;
    const a=rgb565(c0),b=rgb565(c1),pal=[a,b];
    if(c0>c1)pal.push([(2*a[0]+b[0])/3,(2*a[1]+b[1])/3,(2*a[2]+b[2])/3],
                       [(a[0]+2*b[0])/3,(a[1]+2*b[1])/3,(a[2]+2*b[2])/3]);
    else pal.push([(a[0]+b[0])/2,(a[1]+b[1])/2,(a[2]+b[2])/2],[0,0,0]);
    const bits=data[o+4]|data[o+5]<<8|data[o+6]<<16|data[o+7]<<24;
    for(let py=0;py<4;py++)for(let px=0;px<4;px++){
      const x=bx*4+px,y=by*4+py;if(x>=w||y>=h)continue;
      const idx=(bits>>>(2*(py*4+px)))&3, q=(y*w+x)*4;
      out[q]=pal[idx][0];out[q+1]=pal[idx][1];out[q+2]=pal[idx][2];out[q+3]=255;
    }
  } return out;
}
function decodeDXT3(data,w,h){
  const out=new Uint8ClampedArray(w*h*4),bw=Math.ceil(w/4),bh=Math.ceil(h/4);
  for(let by=0;by<bh;by++)for(let bx=0;bx<bw;bx++){
    const o=(by*bw+bx)*16;if(o+16>data.length)continue;
    const c0=data[o+8]|data[o+9]<<8,c1=data[o+10]|data[o+11]<<8;
    const a=rgb565(c0),b=rgb565(c1),pal=[a,b,[(2*a[0]+b[0])/3,(2*a[1]+b[1])/3,(2*a[2]+b[2])/3],[(a[0]+2*b[0])/3,(a[1]+2*b[1])/3,(a[2]+2*b[2])/3]];
    const bits=data[o+12]|data[o+13]<<8|data[o+14]<<16|data[o+15]<<24;
    for(let py=0;py<4;py++)for(let px=0;px<4;px++){
      const x=bx*4+px,y=by*4+py;if(x>=w||y>=h)continue;
      const ci=(bits>>>(2*(py*4+px)))&3,q=(y*w+x)*4;
      const ab=(py*4+px), av=((data[o+(ab>>1)]>>((ab&1)*4))&15)*17;
      out[q]=pal[ci][0];out[q+1]=pal[ci][1];out[q+2]=pal[ci][2];out[q+3]=av;
    }
  } return out;
}
function decodeDXT5(data,w,h){
  const out=new Uint8ClampedArray(w*h*4),bw=Math.ceil(w/4),bh=Math.ceil(h/4);
  for(let by=0;by<bh;by++)for(let bx=0;bx<bw;bx++){
    const o=(by*bw+bx)*16;if(o+16>data.length)continue;
    const a0=data[o],a1=data[o+1],ab=data.subarray(o+2,o+8);
    const ap=[a0,a1];
    if(a0>a1)for(let i=1;i<=6;i++)ap.push(((7-i)*a0+i*a1)/7);
    else{for(let i=1;i<=4;i++)ap.push(((5-i)*a0+i*a1)/5);ap.push(0,255)}
    let abit=0n;for(let i=0;i<6;i++)abit|=BigInt(ab[i])<<(8n*BigInt(i));
    const c0=data[o+8]|data[o+9]<<8,c1=data[o+10]|data[o+11]<<8;
    const ca=rgb565(c0),cb=rgb565(c1),pal=[ca,cb,[(2*ca[0]+cb[0])/3,(2*ca[1]+cb[1])/3,(2*ca[2]+cb[2])/3],[(ca[0]+2*cb[0])/3,(ca[1]+2*cb[1])/3,(ca[2]+2*cb[2])/3]];
    const cbits=(data[o+12]|data[o+13]<<8|data[o+14]<<16|data[o+15]<<24)>>>0;
    for(let py=0;py<4;py++)for(let px=0;px<4;px++){
      const x=bx*4+px,y=by*4+py;if(x>=w||y>=h)continue;
      const n=py*4+px,ci=(cbits>>>(2*n))&3,ai=Number((abit>>BigInt(3*n))&7n),q=(y*w+x)*4;

function enhance(src){
  const b=+$('bright').value/100,c=+$('contrast').value/100,g=+$('gamma').value/100;
  const useA=$('useAlpha').checked, out=new Uint8ClampedArray(src);
  for(let i=0;i<out.length;i+=4){
    for(let k=0;k<3;k++){let v=out[i+k]/255;v=Math.pow(v,1/g);v*=b;v=(v-.5)*c+.5;out[i+k]=clamp(v*255)}
    out[i+3]=useA?src[i+3]:255;
  }
  const sharp=(window.__livePreview?0:+$('sharp').value/100);
  if(sharp>0){
    const tmp=new Uint8ClampedArray(out),w=state.decoded?.w||1,h=state.decoded?.h||1;
    for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){
      const q=(y*w+x)*4;
      for(let k=0;k<3;k++){
        const avg=(tmp[q-4+k]+tmp[q+4+k]+tmp[q-w*4+k]+tmp[q+w*4+k])/4;
        out[q+k]=clamp(tmp[q+k]+(tmp[q+k]-avg)*sharp);

  return out;
}

let renderRAF=0, renderTimer=0, renderVersion=0;

function drawPixelsToCanvas(pixels,w,h,targetW,targetH,quality='high'){
  const src=document.createElement('canvas');
  src.width=w; src.height=h;
  const sctx=src.getContext('2d',{willReadFrequently:false});
  const im=sctx.createImageData(w,h); im.data.set(pixels); sctx.putImageData(im,0,0);
  const c=$('canvas'),ctx=c.getContext('2d',{alpha:false});
  c.width=targetW; c.height=targetH;
  ctx.imageSmoothingEnabled=targetW!==w || targetH!==h;
  ctx.imageSmoothingQuality=quality;
  ctx.clearRect(0,0,targetW,targetH);
  ctx.drawImage(src,0,0,targetW,targetH);
}

function renderNow(full=true){
  if(!state.original)return;
  const d=state.original, scale=Number($('hdScale').value)||1;
  // Saat slider digeser, jangan melakukan upscale+sharpen jutaan piksel pada setiap event.
  // Full-quality hanya dijalankan setelah pengguna berhenti sebentar.
  const workScale=full?scale:1;
  state.decoded={w:d.w,h:d.h};
  let px=enhance(d.pixels);
  let w=d.w,h=d.h;
  if(workScale>1){
    w=Math.min(4096,d.w*workScale); h=Math.min(4096,d.h*workScale);
    drawPixelsToCanvas(px,d.w,d.h,w,h,'high');
    state.decoded={w,h};
    if(full && Number($('hdDetail').value)>0){
      // Sharpen hanya sekali setelah upscale selesai. Dibuat dari ImageData canvas agar
      // slider tetap ringan; tidak mengulang resize custom bicubic di setiap event.
      const ctx=$('canvas').getContext('2d',{willReadFrequently:true});
      const cur=ctx.getImageData(0,0,w,h);
      const sh=detailSharpen(cur.data,w,h,Number($('hdDetail').value)||0);
      cur.data.set(sh); ctx.putImageData(cur,0,0);
    }
  }else{
    drawPixelsToCanvas(px,w,h,w,h,'high');
  }
  $('bright').nextElementSibling.textContent=$('bright').value;
  $('contrast').nextElementSibling.textContent=$('contrast').value;
  $('gamma').nextElementSibling.textContent=$('gamma').value;
  $('sharp').nextElementSibling.textContent=$('sharp').value;
}

function scheduleRender(full=true){
  cancelAnimationFrame(renderRAF);
  if(renderTimer)clearTimeout(renderTimer);
  // Live preview: hanya enhancement pada resolusi asli, sangat ringan di HP.
  renderRAF=requestAnimationFrame(()=>{window.__livePreview=true;renderNow(false);window.__livePreview=false;});
  if(full){
    const token=++renderVersion;
    renderTimer=setTimeout(()=>{ if(token===renderVersion) renderNow(true); },220);
  }
}

function render(){ scheduleRender(true); }

function fourCC(a,p){return String.fromCharCode(a[p],a[p+1],a[p+2],a[p+3]);}

function decodeDDSUncompressed(a,dataOff,w,h,bpp,pfFlags,rMask,gMask,bMask,aMask){

    out[q]=extract(v,rs,bytesPerPixel===4?a[p+2]:a[p+2]);
    out[q+1]=extract(v,gs,bytesPerPixel===4?a[p+1]:a[p+1]);
    out[q+2]=extract(v,bs,bytesPerPixel===4?a[p]:a[p]);
    out[q+3]=bytesPerPixel===4?(as.bits?extract(v,as,255):255):255;

function ddsMipChainSize(w,h,fmt,mips){

  const count=Math.max(1,Math.min(32,mips|0));
  for(let i=0;i<count;i++){

    ww=Math.max(1,ww>>1); hh=Math.max(1,hh>>1);

function inferCompressedDDSFormat(w,h,mips,available,headerFmt){
  const candidates=['DXT1','DXT3','DXT5'];
  const fullMatches=[];

  for(const fmt of candidates){
    const full=ddsMipChainSize(w,h,fmt,mips);
    const top=calcMipSize(w,h,fmt);
    if(available===full) fullMatches.push({fmt,total:full,reason:'exact-mip-chain'});
    if(available===top) topExact.push({fmt,total:top,reason:'exact-mip0'});
  }
  // Strongest evidence: exact complete mip chain, then exact mip-0 size.
  if(fullMatches.length) return fullMatches.find(x=>x.fmt===headerFmt) || fullMatches[0];
  if(topExact.length) return topExact.find(x=>x.fmt===headerFmt) || topExact[0];

  // If the header itself names a compressed format and mip-0 fits, keep it.
  if(headerFmt && available>=calcMipSize(w,h,headerFmt)){
    return {fmt:headerFmt,total:calcMipSize(w,h,headerFmt),reason:'header-mip0'};
  }

  // BC3/DXT5 is the most common alpha-bearing variant in these Point Blank assets;
  // use it when its mip-0 fits, otherwise fall back to DXT1/DXT3 by size.
  const dxt5Top=calcMipSize(w,h,'DXT5');
  if(available>=dxt5Top) return {fmt:'DXT5',total:dxt5Top,reason:'fallback-dxt5'};
  const dxt3Top=calcMipSize(w,h,'DXT3');
  if(available>=dxt3Top) return {fmt:'DXT3',total:dxt3Top,reason:'fallback-dxt3'};
  const dxt1Top=calcMipSize(w,h,'DXT1');
  if(available>=dxt1Top) return {fmt:'DXT1',total:dxt1Top,reason:'fallback-dxt1'};

}

function parseDDS(a){

  if(uncompressed){

    const rec=inferCompressedDDSFormat(w,h,mips,available,null);

    }

  }

  const expectedTop=calcMipSize(w,h,fmt);
  if(available>=expectedTop){
    const tex=a.subarray(dataOff,dataOff+expectedTop);
    const pixels=fmt==='DXT5'?decodeDXT5(tex,w,h):fmt==='DXT3'?decodeDXT3(tex,w,h):decodeDXT1(tex,w,h);
    return {fmt,headerFmt:originalHeaderFmt,w,h,mips,dataOff,total:expectedTop,pixels,extraBytes:Math.max(0,available-expectedTop),dx10,fourCC:cc,recovered:false};
  }

  // Critical recovery for the files shown in the screenshot:
  // 256×256 + 4 mip DXT5 normally needs 87,040 bytes, while some game files
  // contain exactly 43,520 bytes — which is the complete DXT1 chain. In that
  // case the old viewer incorrectly threw an error or decoded DXT1 bytes as DXT5.
  const rec=inferCompressedDDSFormat(w,h,mips,available,fmt);
  if(rec){
    const tex=a.subarray(dataOff,dataOff+rec.total);
    const pixels=rec.fmt==='DXT5'?decodeDXT5(tex,w,h):rec.fmt==='DXT3'?decodeDXT3(tex,w,h):decodeDXT1(tex,w,h);
    return {fmt:rec.fmt,headerFmt:originalHeaderFmt,w,h,mips,dataOff,total:rec.total,pixels,extraBytes:Math.max(0,available-rec.total),dx10,fourCC:cc,recovered:rec.fmt!==fmt,recoveryReason:rec.reason};
  }

  throw new Error(`Payload DDS kurang: perlu ${expectedTop} byte (${fmt}), tersedia ${available} byte`);
}

async function openFile(file,index){
  const buf=await file.arrayBuffer();
  const a=new Uint8Array(buf);
  const isDDS=/\.dds$/i.test(file.name) || str(a,0,4)==='DDS ';
  if(isDDS){
    const d=parseDDS(a);
    state.files[index]={file,bytes:a,off:0,mips:d.mips,info:{fmt:d.fmt,w:d.w,h:d.h,formatCode:'DDS',headerFormat:d.headerFmt||d.fmt,total:d.total,recovered:!!d.recovered},pixels:d.pixels,headerSize:d.dataOff,textureBytes:d.total,extraBytes:d.extraBytes,container:'DDS',recovered:!!d.recovered,recoveryReason:d.recoveryReason||''};
    return;
  }
  const off=findI3IB(a);
  if(off<0)throw new Error('Signature I3IB tidak ditemukan');
  const header=parseI3IHeader(a,off);
  const info=detectFormatAndSize(header.available,header.mips,header);
  if(!info)throw new Error('Format/ukuran texture tidak dapat dikenali');
  const tex=a.subarray(header.headerEnd,header.headerEnd+info.total);
  if(tex.length<info.total)throw new Error('Payload texture tidak lengkap');
  let pixels;
  if(info.fmt==='DXT5')pixels=decodeDXT5(tex,info.w,info.h);
  else if(info.fmt==='DXT3')pixels=decodeDXT3(tex,info.w,info.h);
  else pixels=decodeDXT1(tex,info.w,info.h);
  state.files[index]={file,bytes:a,off,mips:header.mips,info,pixels,headerSize:60,textureBytes:info.total,extraBytes:Math.max(0,header.available-info.total),container:'I3I'};
}

function select(index){
  state.current=index;
  document.querySelectorAll('.item').forEach((e,i)=>e.classList.toggle('active',i===index));
  const f=state.files[index];if(!f)return;
  $('name').textContent=f.file.name;
  $('format').textContent=f.info.fmt;
  $('size').textContent=f.info.w+' × '+f.info.h;
  $('mip').textContent=f.mips||1;
  $('payload').textContent=f.textureBytes;
  state.original={w:f.info.w,h:f.info.h,pixels:f.pixels};
  if(f.container==='DDS'){
    $('status').textContent=`DDS header   : ${f.headerSize} bytes\nTexture data : 0x${f.headerSize.toString(16).toUpperCase()}\nFormat       : ${f.info.fmt}${f.info.headerFormat&&f.info.headerFormat!==f.info.fmt?' (header '+f.info.headerFormat+')':''}\nMipmaps      : ${f.mips||1}\nTexture size : ${f.textureBytes} bytes\nExtra data   : ${f.extraBytes} bytes (mipmap/data tambahan)${f.recovered?'\nRecovery    : format payload disesuaikan dengan ukuran data':''}\nAlpha        : ${$('useAlpha').checked?'AKTIF':'DIABAIKAN (preview solid)'}`;
  }else{
    $('status').textContent=`I3IB offset : 0x${f.off.toString(16).toUpperCase()}\nHeader       : ${f.headerSize} bytes\nTexture data : 0x${(f.off+f.headerSize).toString(16).toUpperCase()}\nFormat code  : ${f.info.formatCode} (${f.info.headerFormat||f.info.fmt})\nFormat pakai : ${f.info.fmt}${f.info.formatMismatch?' (disesuaikan dari payload)':''}\nMipmaps      : ${f.mips||1}\nTexture size : ${f.textureBytes} bytes\nExtra data   : ${f.extraBytes} bytes (diabaikan)\nAlpha        : ${$('useAlpha').checked?'AKTIF':'DIABAIKAN (preview solid)'}`;
  }
  render();
}

function addFiles(files){
  const arr=[...files].filter(f=>/\.(i3i|dds)$/i.test(f.name));
  if(!arr.length){$('status').textContent='Pilih file .i3i atau .dds';return}

  Promise.all(arr.map(async(file)=>{
    const index=state.files.length;
    state.files.push({file,loading:true});
    try{
      await openFile(file,index);
    }catch(e){
      state.files[index].error=(e&&e.message)?e.message:String(e);
    }finally{
      state.files[index].loading=false;
    }
  })).then(()=>{
    renderList();
    const first=state.files.findIndex(x=>x.info&&!x.error);
    if(first>=0 && (state.current<0 || !state.files[state.current]?.info))select(first);
  });
}

function renderList(){
  $('list').innerHTML='';
  state.files.forEach((f,i)=>{
    const d=document.createElement('div');d.className='item';
    d.innerHTML=`<b>${f.file.name}</b><small>${f.loading?'MEMBACA...':(f.error?'ERROR: '+f.error:(f.info.fmt+' • '+f.info.w+'×'+f.info.h+' • mip '+(f.mips||1)+(f.container==='DDS'?' • DDS':'')+(f.recovered?' • recovered':'')))}</small>`;
    d.onclick=()=>!f.error&&select(i);
    $('list').appendChild(d);
  });
}


function getRenderedPixels(){
  return state.original ? enhance(state.original.pixels) : null;
}
function makePalette(pixels,mode,q){
  const pal=[];

  if(mode==='websafe'){
    const v=[0,51,102,153,204,255];
    for(const r of v)for(const g of v)for(const b of v)pal.push([r,g,b]);
    while(pal.length<256)pal.push([0,0,0]); return pal.slice(0,256);
  }
  if(q==='uniform'){
    for(let r=0;r<8;r++)for(let g=0;g<8;g++)for(let b=0;b<4;b++)pal.push([r*255/7,g*255/7,b*255/3]);
    return pal;
  }

  for(let i=0;i<pixels.length;i+=4){
    const r=pixels[i]>>3,g=pixels[i+1]>>3,b=pixels[i+2]>>3,k=(r<<10)|(g<<5)|b;

    pal.push([((k>>10)&31)*255/31,((k>>5)&31)*255/31,(k&31)*255/31]);

  return pal.slice(0,256);
}

        for(let k=0;k<3;k++){let sum=0,ws=0;for(let j=-1;j<=2;j++){const yy=Math.max(0,Math.min(sh-1,y0+j)),wy=cubic(j-ty);for(let i=-1;i<=2;i++){const xx=Math.max(0,Math.min(sw-1,x0+i)),w=wy*cubic(i-tx);sum+=src[(yy*sw+xx)*4+k]*w;ws+=w;}}o[b+k]=clamp(sum/(ws||1));}o[b+3]=255;
      }
    }
  }
  return o;
}
function detailSharpen(src,w,h,amount){
  if(!amount)return src; const out=new Uint8ClampedArray(src),tmp=new Uint8ClampedArray(src),a=amount/100;
  for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const q=(y*w+x)*4;for(let k=0;k<3;k++){const avg=(tmp[q-4+k]+tmp[q+4+k]+tmp[q-w*4+k]+tmp[q+w*4+k]+tmp[q-w*4-4+k]+tmp[q-w*4+4+k]+tmp[q+w*4-4+k]+tmp[q+w*4+4+k])/8;out[q+k]=clamp(tmp[q+k]+(tmp[q+k]-avg)*a*1.35);}}
  return out;
}
function exportBMP8(){
  if(state.current<0||!state.original){alert('Pilih I3I atau DDS terlebih dahulu.');return;}
  const sw=state.original.w,sh=state.original.h;let pix=getRenderedPixels();
  let w=parseInt($('bmpW').value),h=parseInt($('bmpH').value);
  const scale=Number($('hdScale').value)||1;
  if(!w)w=Math.round(sw*scale); if(!h)h=Math.round(sh*scale);
  w=Math.max(1,Math.min(8192,w));h=Math.max(1,Math.min(8192,h));
  pix=resizePixels(pix,sw,sh,w,h,$('resizeFilter').value);
  pix=detailSharpen(pix,w,h,Number($('hdDetail').value)||0);
  const pal=makePalette(pix,$('paletteMode').value,$('quantization').value);
  const ix=makeIndexedPixels(pix,w,h,pal,$('ditherMode').value==='floyd');
  const row=Math.ceil(w/4)*4,pixelBytes=row*h,offset=14+40+1024,size=offset+pixelBytes;
  const buf=new ArrayBuffer(size),dv=new DataView(buf),u=new Uint8Array(buf);let p=0;
  u[p++]=0x42;u[p++]=0x4D;dv.setUint32(p,size,true);p+=4;dv.setUint16(p,0,true);p+=2;dv.setUint16(p,0,true);p+=2;dv.setUint32(p,offset,true);p+=4;
  dv.setUint32(p,40,true);p+=4;const top=$('rowDirection').value==='top';dv.setInt32(p,w,true);p+=4;dv.setInt32(p,top?-h:h,true);p+=4;
  dv.setUint16(p,1,true);p+=2;dv.setUint16(p,8,true);p+=2;dv.setUint32(p,0,true);p+=4;dv.setUint32(p,pixelBytes,true);p+=4;
  const dpi=Number($('bmpDpi').value)||72,ppm=Math.round(dpi*39.37007874015748);dv.setInt32(p,ppm,true);p+=4;dv.setInt32(p,ppm,true);p+=4;dv.setUint32(p,256,true);p+=4;dv.setUint32(p,256,true);p+=4;
  for(let i=0;i<256;i++){const c=pal[i];u[p++]=Math.round(c[2]);u[p++]=Math.round(c[1]);u[p++]=Math.round(c[0]);u[p++]=0;}
  const ys=top?[...Array(h).keys()]:[...Array(h).keys()].reverse();
  for(const y of ys){const s=p;for(let x=0;x<w;x++)u[p++]=ix[y*w+x];while(p-s<row)u[p++]=0;}
  const blob=new Blob([buf],{type:'image/bmp'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=state.files[state.current].file.name.replace(/\.(i3i|dds)$/i,'')+'_8bit.bmp';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

function syncValue(id,source){const el=$(id),num=$(id+'Num'),out=$(id==='bright'?'bv':id==='contrast'?'cv':id==='gamma'?'gv':id==='sharp'?'sv':'hdv');let v=Math.round(+(source==='num'?num.value:el.value));v=Math.max(+el.min,Math.min(+el.max,v));el.value=v;num.value=v;out.textContent=v}
function manualInput(id){const el=$(id),num=$(id+'Num'),out=$(id==='bright'?'bv':id==='contrast'?'cv':id==='gamma'?'gv':id==='sharp'?'sv':'hdv');if(num.value==='')return;const v=Number(num.value);if(!Number.isFinite(v))return;out.textContent=Math.round(v);if(v>=+el.min&&v<=+el.max){el.value=Math.round(v);scheduleRender(true)}}
function manualCommit(id){const el=$(id),num=$(id+'Num');let v=Math.round(Number(num.value));if(!Number.isFinite(v))v=+el.value;v=Math.max(+el.min,Math.min(+el.max,v));el.value=v;num.value=v;syncValue(id,'range');scheduleRender(true)}
['bright','contrast','gamma','sharp','hdDetail'].forEach(id=>{ $(id).addEventListener('input',()=>{syncValue(id,'range');scheduleRender(true)}); $(id+'Num').addEventListener('input',()=>manualInput(id)); $(id+'Num').addEventListener('change',()=>manualCommit(id)); $(id+'Num').addEventListener('blur',()=>manualCommit(id)); });
function syncAllValues(){['bright','contrast','gamma','sharp','hdDetail'].forEach(id=>syncValue(id,'range'))}syncAllValues();
$('files').onchange=e=>addFiles(e.target.files);
$('bmp8').onclick=exportBMP8;
['useAlpha'].forEach(id=>$(id).addEventListener('input',()=>scheduleRender(true)));
['hdScale','resizeFilter'].forEach(id=>$(id).addEventListener('change',()=>renderNow(true)));
$('reset').onclick=()=>{$('bright').value=115;$('contrast').value=125;$('gamma').value=80;$('sharp').value=45;$('useAlpha').checked=false;$('paletteMode').value='adaptive';$('rowDirection').value='bottom';$('quantization').value='histogram';$('ditherMode').value='floyd';$('bmpW').value='';$('bmpH').value='';$('bmpDpi').value=72;$('hdScale').value='4';$('resizeFilter').value='bicubic';$('hdDetail').value=60;syncAllValues();render()};
$('png').onclick=()=>{
  if(state.current<0)return;
  const c=$('canvas');const a=document.createElement('a');
  a.href=c.toDataURL('image/png');a.download=state.files[state.current].file.name.replace(/\.(i3i|dds)$/i,'')+'_preview.png';a.click();
};
$('drop').ondragover=e=>{e.preventDefault();$('drop').classList.add('drag')};
$('drop').ondragleave=()=>$('drop').classList.remove('drag');
$('drop').ondrop=e=>{e.preventDefault();$('drop').classList.remove('drag');addFiles(e.dataTransfer.files)};
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',e=>e.preventDefault());
</script>
